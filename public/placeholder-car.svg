<!-- Arquivo SVG para placeholder de carro -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#carGradient)"/>
  <!-- Silhueta de carro simples -->
  <g transform="translate(50, 100)">
    <!-- Corpo do carro -->
    <path d="M0 80 L50 40 L250 40 L300 80 L300 120 L280 120 C280 135 268 145 253 145 C238 145 226 135 226 120 L74 120 C74 135 62 145 47 145 C32 145 20 135 20 120 L0 120 Z" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    <!-- Janelas -->
    <path d="M60 40 L240 40 L280 75 L60 75 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <!-- Rodas -->
    <circle cx="47" cy="120" r="20" fill="#374151" stroke="#1f2937" stroke-width="3"/>
    <circle cx="253" cy="120" r="20" fill="#374151" stroke="#1f2937" stroke-width="3"/>
    <!-- Centro das rodas -->
    <circle cx="47" cy="120" r="8" fill="#6b7280"/>
    <circle cx="253" cy="120" r="8" fill="#6b7280"/>
  </g>
</svg>