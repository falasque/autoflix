<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forçar Atualização - Autoflix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status-item:last-child {
            margin-bottom: 0;
        }
        .icon {
            font-size: 20px;
        }
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .success.show {
            display: block;
        }
        .log {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-line {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Forçar Atualização</h1>
        <p class="subtitle">Limpar cache e atualizar para a versão mais recente</p>

        <div class="status">
            <div class="status-item">
                <span class="icon" id="sw-icon">⏳</span>
                <span id="sw-status">Verificando Service Worker...</span>
            </div>
            <div class="status-item">
                <span class="icon" id="cache-icon">⏳</span>
                <span id="cache-status">Verificando cache...</span>
            </div>
            <div class="status-item">
                <span class="icon" id="version-icon">⏳</span>
                <span id="version-status">Verificando versão...</span>
            </div>
        </div>

        <button id="updateBtn" onclick="forceUpdate()">
            🔄 Limpar Cache e Atualizar
        </button>

        <div class="success" id="successMsg">
            ✅ <strong>Atualização concluída!</strong><br>
            A página será recarregada em 3 segundos...
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = 'log-line';
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        async function checkStatus() {
            addLog('🔍 Verificando status atual...');

            // Service Worker
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const swIcon = document.getElementById('sw-icon');
                const swStatus = document.getElementById('sw-status');
                
                if (registrations.length > 0) {
                    swIcon.textContent = '✅';
                    swStatus.textContent = `Service Worker ativo (${registrations.length} registro(s))`;
                    addLog(`✅ Service Worker encontrado: ${registrations.length} registro(s)`);
                    
                    // Verificar versão do SW
                    registrations.forEach((reg, idx) => {
                        if (reg.active) {
                            addLog(`   SW ${idx + 1}: ${reg.active.scriptURL}`);
                        }
                    });
                } else {
                    swIcon.textContent = '❌';
                    swStatus.textContent = 'Nenhum Service Worker ativo';
                    addLog('❌ Nenhum Service Worker encontrado');
                }
            }

            // Cache
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                const cacheIcon = document.getElementById('cache-icon');
                const cacheStatus = document.getElementById('cache-status');
                
                if (cacheNames.length > 0) {
                    cacheIcon.textContent = '✅';
                    cacheStatus.textContent = `${cacheNames.length} cache(s) encontrado(s)`;
                    addLog(`✅ Caches encontrados: ${cacheNames.length}`);
                    cacheNames.forEach(name => {
                        addLog(`   - ${name}`);
                    });
                } else {
                    cacheIcon.textContent = '❌';
                    cacheStatus.textContent = 'Nenhum cache encontrado';
                    addLog('❌ Nenhum cache encontrado');
                }
            }

            // Versão
            const versionIcon = document.getElementById('version-icon');
            const versionStatus = document.getElementById('version-status');
            versionIcon.textContent = '✅';
            versionStatus.textContent = 'Pronto para atualizar';
            addLog('✅ Sistema pronto para atualização');
        }

        async function forceUpdate() {
            const btn = document.getElementById('updateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Atualizando...';
            
            addLog('');
            addLog('🚀 INICIANDO LIMPEZA FORÇADA...');
            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            try {
                // 1. Desregistrar Service Workers
                if ('serviceWorker' in navigator) {
                    addLog('1️⃣ Desregistrando Service Workers...');
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    
                    for (const registration of registrations) {
                        const success = await registration.unregister();
                        addLog(`   ${success ? '✅' : '❌'} ${registration.scope}`);
                    }
                    
                    document.getElementById('sw-icon').textContent = '🗑️';
                    document.getElementById('sw-status').textContent = 'Service Workers removidos';
                }

                // 2. Limpar todos os caches
                if ('caches' in window) {
                    addLog('2️⃣ Removendo todos os caches...');
                    const cacheNames = await caches.keys();
                    
                    for (const cacheName of cacheNames) {
                        const success = await caches.delete(cacheName);
                        addLog(`   ${success ? '✅' : '❌'} ${cacheName}`);
                    }
                    
                    document.getElementById('cache-icon').textContent = '🗑️';
                    document.getElementById('cache-status').textContent = 'Caches removidos';
                }

                // 3. Limpar localStorage
                addLog('3️⃣ Limpando localStorage...');
                localStorage.clear();
                addLog('   ✅ localStorage limpo');

                // 4. Limpar sessionStorage
                addLog('4️⃣ Limpando sessionStorage...');
                sessionStorage.clear();
                addLog('   ✅ sessionStorage limpo');

                addLog('');
                addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                addLog('✅ LIMPEZA CONCLUÍDA COM SUCESSO!');
                addLog('🔄 Recarregando página em 3 segundos...');

                document.getElementById('successMsg').classList.add('show');
                document.getElementById('version-icon').textContent = '✅';
                document.getElementById('version-status').textContent = 'Atualização concluída!';

                // Recarregar após 3 segundos
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);

            } catch (error) {
                addLog('');
                addLog('❌ ERRO: ' + error.message);
                btn.disabled = false;
                btn.textContent = '🔄 Tentar Novamente';
            }
        }

        // Verificar status ao carregar
        window.addEventListener('load', () => {
            setTimeout(checkStatus, 500);
        });
    </script>
</body>
</html>
